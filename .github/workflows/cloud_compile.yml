name: Zero-Heat Cloud Compiler

on:
  push:
    branches: [ main, master ]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: "zulu"
        java-version: "17"

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK Component Natively
      run: |
        sdkmanager --install "ndk;26.1.10909125"

    - name: Cross-Compile Standalone Static Llama Binary
      run: |
        echo "=== INITIALIZING REMOTE CROSS-COMPILATION FOR ARM64 ==="
        export ANDROID_NDK=$ANDROID_HOME/ndk/26.1.10909125
        
        git clone https://github.com/ggerganov/llama.cpp.git cloud-llama-source
        cd cloud-llama-source
        mkdir build && cd build
        
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=ON \
              -DLLAMA_BUILD_SERVER=OFF \
              -GNinja ..
              
        # target updated to the fresh system naming convention
        ninja llama-app

    - name: Upload Compiled Static Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: static-llama-cli-arm64
        path: cloud-llama-source/build/bin/llama-app